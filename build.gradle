plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.uua'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 프로젝트 경로에 한글(`...\개인 프로젝트\Uua\...`)이 있어 Windows worker JVM의
// sun.jnu.encoding(Cp949)이 build/classes 디렉터리 경로를 잘못 디코딩 → ClassNotFoundException.
// 컴파일은 통과하지만 런타임에 클래스 못 찾는 문제 회피 — build 디렉터리만 ASCII 경로로 이동.
// (build 디렉터리는 캐시/생성물이라 git ignore 대상, 이동해도 안전.)
layout.buildDirectory.set(file('C:/temp/uua-build'))

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// GeminiEmbeddingClient를 실제 Gemini 호출 없이 검증 — 가짜 HTTP 서버.
	// Spring Boot 3.5 BOM이 mockwebserver 버전을 관리하지 않아 명시(OkHttp 4.x 마지막).
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	// 통합테스트에서 pgvector(vector(768)) 컬럼이 실제로 동작하는지 확인.
	// 일반 postgres 이미지 대신 pgvector/pgvector:pg16 이미지를 PostgreSQLContainer로 감싼다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 한글이 포함된 절대경로(`...\개인 프로젝트\Uua\...`)에서 테스트 워커 JVM이
	// 클래스 파일을 못 찾는 문제 회피 — 워커 JVM의 file.encoding을 UTF-8로 강제.
	jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
