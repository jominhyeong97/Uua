spring.application.name=uua

# --- Server ---
# Render 등 PaaS는 PORT 환경변수로 리스닝 포트를 지정한다. 없으면 로컬 기본 8080.
server.port=${PORT:8080}

# --- Datasource ---
# 로컬(dev): spring-boot-docker-compose가 compose.yaml의 pgvector 컨테이너를 자동 기동하고
#   연결정보를 주입하므로 아래 값은 폴백(컴포즈를 수동으로 돌릴 때)용.
# 배포(prod): SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 환경변수로 덮어쓴다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}

# --- JPA ---
# 스키마는 Flyway가 관리. Hibernate는 엔티티와 테이블이 맞는지 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
# flyway-core가 클래스패스에 있으면 부팅 시 db/migration의 V*.sql을 자동 적용.
spring.flyway.enabled=true

# --- Actuator ---
# /actuator/health 공개(단계 ① 헬스체크 및 배포 검증용).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# --- Embedding (Gemini, 단계 ②) ---
# api-key는 빈 값으로 부팅 허용(테스트/로컬에서 키 없이 컴파일·기동 확인용).
# 실제 호출 시점에 GeminiEmbeddingClient가 API_KEY_MISSING으로 503을 던진다.
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
# 설계 SSOT의 text-embedding-004 대신 무료티어가 살아있는 gemini-embedding-001(768차원)을 쓴다.
gemini.model=${GEMINI_MODEL:gemini-embedding-001}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:10}
# DB 스키마(vector(768))와 반드시 일치. 응답이 다른 차원이면 INVALID_RESPONSE로 503.
gemini.dimension=${GEMINI_DIMENSION:768}

# --- Ingest (단계 ④) ---
# 청크별 임베딩 호출 사이 딜레이(ms). 무료 RPM 보호용 — 0이면 sleep 없음(테스트용).
ingest.throttle-millis=${INGEST_THROTTLE_MILLIS:200}
# 청크 한 개 글자 수 상한. DESIGN.md SSOT: ~500 토큰 = 2000자(token ≈ chars/4 근사).
ingest.window-chars=${INGEST_WINDOW_CHARS:2000}
