# 프로젝트 경로에 한글이 포함됨(`...\개인 프로젝트\Uua\...`).
# Windows에서 Gradle 데몬·테스트 워커 JVM의 sun.jnu.encoding이 Cp949로 떨어지면
# 클래스패스 디렉터리 경로를 잘못 디코딩해 ClassNotFoundException이 난다.
# 두 인코딩을 모두 UTF-8로 고정하면 데몬/워커 모두 정상 동작.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
